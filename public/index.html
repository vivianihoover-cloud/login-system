<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Please Sign In</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Login/Signup Screen -->
  <div id="auth-screen" class="screen active">
    <div class="card">
      <h1>Please Sign In</h1>

      <div class="toggle-row">
        <button class="tab active" data-mode="login" type="button">Sign In</button>
        <button class="tab" data-mode="signup" type="button">Create Account</button>
      </div>

      <form id="auth-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Username" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Password" required />

        <button class="submit-btn" type="submit">Enter</button>
      </form>

      <p id="message" class="message" aria-live="polite"></p>
    </div>
  </div>

  <!-- Loading Screen -->
  <div id="loading-screen" class="screen">
    <div class="loading-container">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
  </div>

  <!-- Dashboard Screen -->
  <div id="dashboard-screen" class="screen">
    <div class="dashboard">
      <div class="dashboard-content">
        <h2>Welcome!</h2>
        <p id="welcome-username"></p>
      </div>

      <div class="dashboard-footer">
        <div id="current-time" class="time-display">00:00:00</div>
        <button id="shopping-btn" class="shopping-btn" title="Shopping">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
